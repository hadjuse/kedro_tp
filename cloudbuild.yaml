options:
  automapSubstitutions: true

# Variables
substitutions:
  _GITHUB_REPOSITORY: "hadjuse/kedro_tp.git"
  _BRANCH_NAME: "staging" # Valeur par défaut si non fournie par le trigger

steps:
  - name: gcr.io/cloud-builders/gsutil
    id: unpack-cache
    entrypoint: bash
    args:
      - '-c'
      - |
        gsutil cp gs://votre-bucket-cache/cache.tar.gz /tmp/cache.tar.gz || exit 0
        tar -xzf /tmp/cache.tar.gz -C / || exit 0

  - name: "ghcr.io/astral-sh/uv:python3.12-trixie-slim"
    id: CI
    entrypoint: /bin/sh
    args:
      - "-c"
      - "chmod a+x install.sh && ./install.sh && uv sync && uv run pytest ."
    env:
      - "UV_CACHE_DIR=/root/.cache/uv"
    waitFor: ["unpack-cache"]

  - name: "ghcr.io/astral-sh/uv:python3.12-trixie-slim"
    id: CD
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        # On définit la branche finale : priorité au Trigger, sinon valeur par défaut
        FINAL_BRANCH=${BRANCH_NAME:-$_BRANCH_NAME}
        chmod a+x install.sh && ./install.sh && ENV=$$FINAL_BRANCH uv run kedro run
    env:
      - "MLFLOW_SERVER=$_MLFLOW_SERVER"
      - "DO_NOT_TRACK=1"
      - "UV_CACHE_DIR=/root/.cache/uv" 
    waitFor: ["CI"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: API Deploy
    secretEnv: ["GITHUB_FGT_API"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        mkdir -p conf/local
        # On utilise la même logique pour le clone Git
        FINAL_BRANCH=${BRANCH_NAME:-$_BRANCH_NAME}
        git clone --branch $$FINAL_BRANCH https://x-access-token:$$GITHUB_FGT_API@github.com/$_GITHUB_REPOSITORY /tmp/purchase_predict_api || { echo "Le clone a échoué"; exit 1; }
        
        cd /tmp/purchase_predict_api
        
        gcloud builds submit \
          --config /tmp/purchase_predict_api/cloudbuild.yaml \
          --substitutions=SHORT_SHA=$SHORT_SHA,_MLFLOW_SERVER=$_MLFLOW_SERVER
    waitFor: ["CD"]

logs_bucket: gs://logs_purchase_predict/logs_build_cloud_build
timeout: 1200s

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/api-vm-gcp/versions/latest
      env: GITHUB_FGT_API